[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
